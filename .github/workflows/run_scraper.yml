name: Run Daily Web Scraper

on:
  workflow_dispatch: # Allows you to manually click a button to run it anytime
  schedule:
    - cron: '0 0 * * *' # Automatically runs every day at midnight UTC

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Scraper
      env:
        BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      run: python scrapping_github.py

    - name: Commit and Push Results
      run: |
        git config --global user.name "dariukas"
        git config --global user.email "dariukas@gmail.com"
        git add scraped_results.json || true
        git commit -m "Automated data update [skip ci]" || true
        git push || true
